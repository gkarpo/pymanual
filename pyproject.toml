[project]
name = "pymanual"
version = "1.2.0"
description = "Resolve the documentation URL for any Python module or PyPI distribution name."
readme = "README.md"
authors = [
    { name = "George Karpodinis", email = "1519852+gkarpo@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
keywords = ["documentation", "docs", "python", "pypi", "module", "cli", "url-resolver"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/gkarpo/pymanual"
Repository = "https://github.com/gkarpo/pymanual"
Issues = "https://github.com/gkarpo/pymanual/issues"

[project.scripts]
pymanual = "pymanual._cli:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
